            </ul>
        </nav>
    </head>
    <body>
        <input type="number" id="current" value="0">
        <input type="number" id="interest" value="0">
        <input type="number" id="desired" value="0">
        <button onclick="run()">Calculate</button>
        <script>
            function run() {
                var current = document.getElementById("current").value;
                var interestpercent = document.getElementById("interest").value;
                var desired = document.getElementById("desired").value;
                let interestdecimal = interestpercent / 100
                let balance = current
                alert("£" + balance + " starting balance - " + interestpercent + "% interest rate (" + interestdecimal + ")")
                let i = 1
                let newbalance = current
                while (balance < desired) {
                    newbalance = newbalance * (interestdecimal + 1)
                    alert("Year " + i + ": New balance = " + balance + " + (" + balance + "*" + interestdecimal + ") = £" + newbalance)
                    balance = newbalance
                    i = i + 1
                }
                alert("Your balance is: " + balance)
            }
        </script>
    </body>
