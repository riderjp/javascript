    <body>
        <input type="number" id="mark" value="0">
        <button onclick="tograde()">Grade</button>
        <script>2
            function tograde() {
                var mark = document.getElementById("mark").value;
                if (mark == 0) {
                    grade = "U";
                } else if (mark < 5) {
                    grade = "G";
                } else if (mark < 14) {
                    grade = "F";
                } else if (mark < 23) {
                    grade = "E";
                } else if (mark < 32) {
                    grade = "D";
                } else if (mark < 42) {
                    grade = "C";
                } else if (mark < 55) {
                    grade = "B";
                } else if (mark < 68) {
                    grade = "A";
                } else {
                    grade = "A*";
                }
                alert("Grade is " + grade);
            }
        </script>
